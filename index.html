<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepala Koki SPPG: MBG Sehat &amp; Zero Waste</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d6ecf5;--panel:#fffdf6;--ink:#1c2b25;--mute:#5d6d65;--line:#d3dfd8;--brand:#1e5fb4;--brand-ink:#fff;--gold:#f2b705;--bad:#c62828;--bad-bg:#fde7e4;--ok:#1f8a4c;--ok-bg:#e3f5e9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10202c;--panel:#17262f;--ink:#eaf3ee;--mute:#9db0a6;--line:#2c424d;--brand:#5aa2f0;--brand-ink:#06203a;--bad:#ff8a80;--bad-bg:#431c19;--ok:#5fd68c;--ok-bg:#173826;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10202c;--panel:#17262f;--ink:#eaf3ee;--mute:#9db0a6;--line:#2c424d;--brand:#5aa2f0;--brand-ink:#06203a;--bad:#ff8a80;--bad-bg:#431c19;--ok:#5fd68c;--ok-bg:#173826;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif}
/* tata letak: area 3D dan panel kontrol terpisah, jadi panel tidak pernah menutupi meja */
#app{display:flex;flex-direction:column;height:100%}
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#stage.flash::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 6px var(--bad),inset 0 0 60px var(--bad);animation:fl 1.2s ease-out forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#hud{position:absolute;left:8px;top:8px;display:flex;gap:6px;pointer-events:none;font-size:13px;font-weight:700}
#hud span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 9px}
#toast{position:absolute;left:50%;top:40px;transform:translateX(-50%);max-width:92%;padding:7px 13px;border-radius:12px;font-weight:700;font-size:13px;text-align:center;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}#toast.ok{background:var(--ok);color:#fff}
#panel{flex:none;max-height:54vh;display:flex;flex-direction:column;background:var(--panel);border-top:3px solid var(--brand);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);font-size:12px;gap:5px}
@media(min-width:820px){#app{flex-direction:row}#panel{width:380px;max-height:none;border-top:0;border-left:3px solid var(--brand)}}
.stu{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;flex:none}
.sc{flex:none;min-width:92px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:3px 6px;font:inherit;text-align:left;cursor:pointer;line-height:1.15}
.sc.on{border:2px solid var(--brand);background:rgba(30,95,180,.1)}.sc.dn{opacity:.55}
.sc b{display:block;font-size:12px}.sc small{display:block;color:var(--mute);font-size:10px}
.al{display:inline-block;margin-top:1px;padding:0 6px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-size:10px;font-weight:700}
.al.no{background:var(--ok-bg);color:var(--ok)}
#nut{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;flex:none}
.nb{font-size:11px}.nb .r{display:flex;justify-content:space-between}.nb .r em{font-style:normal;color:var(--mute)}
.trk{height:10px;border-radius:6px;background:var(--line);position:relative;overflow:hidden;margin-top:1px}
.fil{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--gold);transition:width .3s,background .3s}
.fil.ok{background:var(--ok)}.fil.hi{background:var(--bad)}
.zone{position:absolute;top:0;bottom:0;background:rgba(30,95,180,.28)}
.dl{font-style:normal;font-weight:700;color:var(--ok);margin-left:4px;animation:dl 1.6s forwards}.dl.m{color:var(--mute)}
@keyframes dl{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#msg{flex:none}
.alert,.okbox,.note{border-radius:9px;padding:4px 8px;font-size:11.5px;font-weight:700}
.alert{background:var(--bad-bg);color:var(--bad);animation:sh .4s}.okbox{background:var(--ok-bg);color:var(--ok)}.note{background:var(--line);color:var(--mute);font-weight:500}
@keyframes sh{20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
#ing{flex:1 1 auto;min-height:84px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;align-content:start;-webkit-overflow-scrolling:touch}
.it{border:1px solid var(--line);border-radius:10px;padding:2px 4px;display:flex;align-items:center;gap:3px;font-size:11px}
.it.bad{border-color:var(--bad);background:var(--bad-bg)}
.it .nm{flex:1;min-width:0;line-height:1.05}.it .nm small{display:block;color:var(--mute);font-size:9px}
.it button{width:24px;height:24px;border-radius:7px;border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;cursor:pointer;padding:0;flex:none}
.it button.m{background:var(--line);color:var(--ink)}.it b{min-width:10px;text-align:center}
#act{display:flex;gap:6px;flex:none}
.btn{flex:1;border:0;border-radius:11px;padding:7px;font:inherit;font-weight:700;font-size:14px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.sec{background:var(--line);color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}
#hud{flex-wrap:wrap;right:8px}
.warn{background:#fff3cd;color:#7a5a00;border-radius:9px;padding:4px 8px;font-size:11.5px;font-weight:700;margin-top:3px}
#toast.warn{background:var(--gold);color:#3a2a00}
#med{flex:none;font-size:11px;color:var(--mute);line-height:1.25}
#tabs{display:flex;gap:4px;flex:none}.tb{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:3px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tb.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wz{grid-column:1/-1}
.wm{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:2px 0 4px}.wm i{display:block;height:100%;transition:width .3s,background .3s}
.wr{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:2px 6px;font-size:11.5px;margin-bottom:3px}.wr .nm{flex:1}
.wr button{border:0;border-radius:8px;padding:3px 7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:#fff}.wr .k{background:#2f8a4a}.wr .b{background:#c4620f}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div><div id="toast"></div></div>
  <div id="panel">
    <div id="stu" class="stu"></div><div id="med"></div><div id="nut"></div><div id="msg"></div><div id="tabs"></div><div id="ing"></div><div id="act"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ 1. DATA (tambah bahan / siswa di sini) ============ */
const ING=[
  {id:'nasi',n:'Nasi putih',e:'🍚',c:0xf4efe0,kcal:195,carb:42,prot:4,vit:0,cat:'A'},
  {id:'ayam',n:'Ayam',e:'🍗',c:0xc9822b,kcal:165,carb:0,prot:20,vit:5,cat:'B'},
  {id:'telur',n:'Telur',e:'🥚',c:0xf3e3b5,kcal:75,carb:1,prot:6,vit:8,cat:'B',a:'telur'},
  {id:'ikan',n:'Ikan',e:'🐟',c:0x7fa7c9,kcal:120,carb:0,prot:22,vit:10,cat:'B',a:'ikan'},
  {id:'udang',n:'Udang',e:'🦐',c:0xf08a6a,kcal:100,carb:1,prot:20,vit:5,cat:'B',a:'udang'},
  {id:'tempe',n:'Tempe',e:'🟫',c:0xa88458,kcal:110,carb:9,prot:10,vit:5,cat:'B'},
  {id:'tahu',n:'Tahu',e:'⬜',c:0xf0e2a8,kcal:70,carb:2,prot:8,vit:3,cat:'B'},
  {id:'keju',n:'Keju',e:'🧀',c:0xf5c22d,kcal:110,carb:1,prot:7,vit:10,cat:'B',a:'keju'},
  {id:'bayam',n:'Sayur bayam',e:'🥬',c:0x3f9a4a,kcal:25,carb:4,prot:3,vit:35,cat:'C'},
  {id:'wortel',n:'Wortel',e:'🥕',c:0xf07f1c,kcal:35,carb:8,prot:1,vit:35,cat:'C'},
  {id:'pisang',n:'Pisang',e:'🍌',c:0xf6dc4a,kcal:90,carb:23,prot:1,vit:15,cat:'D'},
  {id:'jeruk',n:'Jeruk',e:'🍊',c:0xf59a23,kcal:50,carb:12,prot:1,vit:40,cat:'D'},
];
// Target satu porsi remaja SMA (perkiraan; sesuaikan dengan AKG resmi). min/max = batas % dianggap seimbang.
const TARGET={
  kcal:{label:'Kalori',unit:'kkal',goal:700,min:85,max:130},
  carb:{label:'Karbohidrat',unit:'g',goal:100,min:75,max:130},
  prot:{label:'Protein',unit:'g',goal:28,min:90,max:150},
  vit:{label:'Vitamin',unit:'%',goal:100,min:100,max:200},
};
const STU=[
  {n:'Rina',k:'XI IPA 2',a:['udang'],r:'reaksi: ruam, bibir bengkak, sesak napas'},{n:'Dito',k:'X-3',a:[],r:'tidak ada riwayat alergi'},{n:'Sari',k:'XII IPS 1',a:['keju'],r:'reaksi: mual, ruam, perut kembung'},
  {n:'Bagas',k:'X-1',a:['ikan'],r:'reaksi: gatal dan muntah'},{n:'Lia',k:'XI IPS 3',a:['telur'],r:'reaksi: ruam kulit dan batuk'},{n:'Nadia',k:'XII IPA 2',a:['udang','keju'],r:'reaksi: ruam dan sesak, hindari keduanya'},
];

/* ============ 2. LOGIKA GAME (terpisah dari tampilan) ============ */
const $=id=>document.getElementById(id), ingBy=Object.fromEntries(ING.map(i=>[i.id,i]));
const S={cur:0,delta:null,lastId:null,done:false,tab:'mix',bin:{},sorted:{kompos:0,biogas:0},good:0,bad:0,made:0,st:[]};
function reset(){ S.cur=0; S.delta=null; S.lastId=null; S.done=false; S.tab='mix'; S.bin={}; S.sorted={kompos:0,biogas:0}; S.good=0; S.bad=0; S.made=0; S.st=STU.map(()=>({tray:{},served:false,warns:0,score:0})); }
reset();
const cur=()=>S.st[S.cur], score=()=>S.st.reduce((a,x)=>a+x.score,0);
function tot(tray){ const t={kcal:0,carb:0,prot:0,vit:0}; for(const id in tray) for(const k in t) t[k]+=ingBy[id][k]*tray[id]; return t; }
function rep(tray){ const t=tot(tray), r={}, low=[], hi=[]; for(const k in TARGET){ const T=TARGET[k], p=Math.round(t[k]/T.goal*100), st=p<T.min?'low':p>T.max?'hi':'ok'; r[k]={v:Math.round(t[k]),pct:p,st}; if(st==='low') low.push(T.label); if(st==='hi') hi.push(T.label); } return {r,low,hi,ok:!low.length&&!hi.length}; }
function conf(i){ const a=STU[i].a; return Object.keys(S.st[i].tray).filter(id=>ingBy[id].a&&a.includes(ingBy[id].a)); }
function add(id,d){
  if(S.done) return; const c=cur(), g=ingBy[id];
  if(c.served) return toast('Ompreng ini sudah disajikan.');
  const q=(c.tray[id]||0)+d; if(q<0) return; if(q>3) return toast('Maksimal 3 porsi per bahan');
  const before=tot(c.tray); if(d<0) toBin(id,1); if(q===0) delete c.tray[id]; else c.tray[id]=q;
  const after=tot(c.tray); S.delta={}; for(const k in after) S.delta[k]=after[k]-before[k]; S.lastId=d>0?id:null; const kmax=TARGET.kcal.goal*TARGET.kcal.max/100; if(d>0&&after.kcal>kmax&&before.kcal<=kmax) toast('🍽️ Porsi melebihi kebutuhan! Berpotensi jadi sisa makanan (food waste).','warn');
  if(d>0&&g.a&&STU[S.cur].a.includes(g.a)){ c.warns++; danger('BAHAYA! '+STU[S.cur].n+' alergi '+g.a+'. '+g.n+' mengkontaminasi ompreng!'); }
  renderLive();
}
/* --- pengelolaan sisa dapur (zero waste) --- */
function toBin(id,n){ S.bin[id]=(S.bin[id]||0)+n; S.made+=n; }
function binN(){ let n=0; for(const k in S.bin) n+=S.bin[k]; return n; }
function zw(){ return Math.max(0,Math.min(100,100-S.made*5+S.good*3-S.bad*4)); }
function bigIng(tray){ let b='',m=0; for(const id in tray){ const v=ingBy[id].kcal*tray[id]; if(v>m){m=v;b=ingBy[id].n;} } return b||'porsi'; }
function sortWaste(id,dest){ if(!S.bin[id]) return; const g=ingBy[id], ok=(g.cat==='C'||g.cat==='D')?'kompos':'biogas';
  S.bin[id]--; if(!S.bin[id]) delete S.bin[id]; S.sorted[dest]++;
  if(dest===ok){ S.good++; toast('♻️ Tepat! '+g.n+' → '+dest+'. '+(ok==='kompos'?'Sisa sayur/buah cepat terurai menjadi pupuk kompos.':'Sisa nasi/lauk berprotein dan berminyak lebih aman diolah menjadi biogas.'),'ok'); }
  else{ S.bad++; toast('Kurang tepat: '+g.n+' lebih cocok ke '+ok+'. '+(ok==='kompos'?'Sayur/buah ideal untuk kompos.':'Lauk dan nasi di kompos memicu bau dan hama.'),'warn'); }
  Scene.bins(S.sorted.kompos,S.sorted.biogas); renderLive(); }
function clearTray(){ if(S.done||cur().served) return; for(const id in cur().tray) toBin(id,cur().tray[id]); cur().tray={}; S.delta=null; S.lastId=null; renderLive(); }
function serve(){
  const c=cur(), r=rep(c.tray); if(S.done||c.served||conf(S.cur).length||!r.ok||!Object.keys(c.tray).length) return;
  c.served=true; c.score=Math.max(40,100-c.warns*10); toast('✅ Ompreng '+STU[S.cur].n+' disajikan (+'+c.score+')','ok');
  const n=S.st.findIndex(x=>!x.served); if(n<0) S.done=true; else S.cur=n; S.delta=null; S.lastId=null; renderAll();
}
function pick(i){ S.cur=i; S.delta=null; S.lastId=null; renderAll(); }

/* ============ 3. UI PANEL ============ */
let tt; function toast(m,k){ const t=$('toast'); t.textContent=m; t.className='on '+(k||''); clearTimeout(tt); tt=setTimeout(()=>t.className='',3200); }
function danger(m){ toast('⚠️ '+m,'bad'); const s=$('stage'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); }
function renderStu(){ const keep=$('stu').scrollLeft;
  $('stu').innerHTML=STU.map((s,i)=>'<button class="sc'+(i===S.cur?' on':'')+(S.st[i].served?' dn':'')+'" data-a="stu" data-v="'+i+'"><b>'+(S.st[i].served?'✓ ':'')+s.n+'</b><small>'+s.k+'</small>'+(s.a.length?'<span class="al">🚫 '+s.a.join(', ')+'</span>':'<span class="al no">tanpa alergi</span>')+'</button>').join('');
  $('stu').scrollLeft=keep; const a=$('stu').children[S.cur]; if(a&&a.scrollIntoView) a.scrollIntoView({block:'nearest',inline:'nearest'}); }
function renderNut(){ const r=rep(cur().tray).r, d=S.delta; let h='';
  for(const k in TARGET){ const T=TARGET[k], x=r[k], sc=T.max*1.15, z0=T.min/sc*100, z1=Math.min(100,T.max/sc*100);
    h+='<div class="nb"><div class="r"><span>'+T.label+(d&&d[k]?'<i class="dl'+(d[k]<0?' m':'')+'">'+(d[k]>0?'+':'')+Math.round(d[k])+'</i>':'')+'</span><em>'+x.v+'/'+T.goal+' '+T.unit+' · '+x.pct+'%</em></div><div class="trk"><div class="zone" style="left:'+z0+'%;width:'+(z1-z0)+'%"></div><div class="fil '+(x.st==='ok'?'ok':x.st==='hi'?'hi':'')+'" style="width:'+Math.min(100,x.pct/sc*100)+'%"></div></div></div>'; }
  $('nut').innerHTML=h; }
function renderMsg(){ const c=cur(), cf=conf(S.cur), r=rep(c.tray), has=Object.keys(c.tray).length; let h;
  if(S.done) h='<div class="okbox">🏆 Semua siswa terlayani! Skor '+score()+' · '+S.st.reduce((a,x)=>a+x.warns,0)+' peringatan alergi · Zero-waste '+zw()+'/100.</div>';
  else if(c.served) h='<div class="okbox">Ompreng '+STU[S.cur].n+' sudah disajikan.</div>';
  else if(cf.length) h='<div class="alert">⚠️ KONTAMINASI: '+cf.map(id=>ingBy[id].n).join(', ')+' memicu alergi '+STU[S.cur].n+'. Keluarkan dari ompreng!</div>';
  else if(!has) h='<div class="note">Baca data alergi '+STU[S.cur].n+', lalu pilih bahan untuk diracik.</div>';
  else if(r.ok) h='<div class="okbox">Aman alergi dan gizi seimbang. Siap disajikan!</div>';
  else h=(r.hi.length?'<div class="warn">🍽️ Porsi berlebih ('+r.hi.join(', ')+') melebihi kebutuhan siswa SMA. Makanan sulit habis dan menjadi sisa (food waste). Kurangi '+bigIng(c.tray)+'.</div>':'')+(r.low.length?'<div class="note">Kurang: '+r.low.join(', ')+'.</div>':'');
  $('msg').innerHTML=h; }
function renderMed(){ const s=STU[S.cur]; $('med').innerHTML='🩺 <b>'+s.n+'</b> · '+s.k+' · SMAN 3 Surakarta — '+(s.a.length?'<b style="color:var(--bad)">alergi '+s.a.join(' + ')+'</b>, '+s.r:s.r)+'.'; }
function renderTabs(){ $('tabs').innerHTML='<button class="tb'+(S.tab==='mix'?' on':'')+'" data-a="tab" data-v="mix">🍽️ Racik</button><button class="tb'+(S.tab==='waste'?' on':'')+'" data-a="tab" data-v="waste">♻️ Sisa Dapur'+(binN()?' ('+binN()+')':'')+'</button>'; }
function renderWaste(){ const t=tot(cur().tray), pot=Math.max(0,Math.round((t.kcal-TARGET.kcal.goal)/1.5)), col=pot>40?'var(--bad)':pot>0?'var(--gold)':'var(--ok)';
  let h='<div class="wz"><div style="display:flex;justify-content:space-between;font-size:11px"><span>Potensi sisa makanan ompreng ini</span><b>≈ '+pot+' g</b></div><div class="wm"><i style="width:'+Math.min(100,pot/150*100)+'%;background:'+col+'"></i></div>'+
    '<div class="'+(pot>0?'warn':'note')+'">'+(pot>0?'Kelebihan '+Math.round(t.kcal-TARGET.kcal.goal)+' kkal di atas kebutuhan. Porsi berlebih sulit dihabiskan siswa lalu terbuang. Takar sesuai kebutuhan gizi.':'Porsi pas berarti sisa makanan minim. Mantap!')+'</div>'+
    '<div class="note" style="margin:6px 0 3px"><b>Bak sisa dapur:</b> bahan yang dikeluarkan dari ompreng. Pilah: sayur/buah → kompos, nasi/lauk → biogas. Bahan pemicu alergi tidak dipakai ulang.</div>';
  const ids=Object.keys(S.bin);
  h+=ids.length?ids.map(id=>'<div class="wr"><span>'+ingBy[id].e+'</span><span class="nm">'+ingBy[id].n+' ×'+S.bin[id]+'</span><button class="k" data-a="sort" data-v="'+id+'|kompos">🌱 Kompos</button><button class="b" data-a="sort" data-v="'+id+'|biogas">🔥 Biogas</button></div>').join(''):'<div class="note">Bak kosong. Bahan yang dikurangi atau dikosongkan akan masuk ke sini.</div>';
  h+='<div class="note" style="margin-top:4px">Kompos: '+S.sorted.kompos+' · Biogas: '+S.sorted.biogas+' · Benar: '+S.good+' · Salah: '+S.bad+' · <b>Zero-waste: '+zw()+'/100</b></div></div>';
  $('ing').innerHTML=h; }
function renderIng(){ renderTabs(); if(S.tab==='waste') return renderWaste(); renderMix(); }
function renderMix(){ const c=cur(), bad=new Set(conf(S.cur)), lock=c.served||S.done;
  $('ing').innerHTML=ING.map(g=>{ const q=c.tray[g.id]||0; return '<div class="it'+(bad.has(g.id)?' bad':'')+'"><span>'+g.e+'</span><span class="nm">'+g.n+'<small>'+g.kcal+' kkal'+(g.a?' · '+g.a:'')+'</small></span><button class="m" data-a="sub" data-v="'+g.id+'" aria-label="Kurangi '+g.n+'"'+(lock?' disabled':'')+'>−</button><b>'+q+'</b><button data-a="add" data-v="'+g.id+'" aria-label="Tambah '+g.n+'"'+(lock?' disabled':'')+'>+</button></div>'; }).join(''); }
function renderAct(){ const c=cur(), ok=!S.done&&!c.served&&!conf(S.cur).length&&rep(c.tray).ok&&Object.keys(c.tray).length>0;
  $('act').innerHTML=S.done?'<button class="btn" data-a="again">Main lagi</button>':'<button class="btn sec" data-a="clear"'+(c.served?' disabled':'')+'>Kosongkan</button><button class="btn" data-a="serve"'+(ok?'':' disabled')+'>Sajikan</button>'; }
function renderHud(){ $('hud').innerHTML='<span>👨‍🍳 Kepala Koki</span><span>Skor '+score()+'</span><span>♻️ '+zw()+'/100</span><span>'+S.st.filter(x=>x.served).length+'/'+STU.length+' siswa</span>'; }
function renderLive(){ renderNut(); renderMsg(); renderIng(); renderAct(); renderHud(); Scene.sync(); } // ringan: dipanggil tiap tambah/kurang bahan
function renderAll(){ renderStu(); renderMed(); renderLive(); }
$('panel').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; const a=b.dataset.a,v=b.dataset.v;
  if(a==='stu') pick(+v); else if(a==='add') add(v,1); else if(a==='sub') add(v,-1); else if(a==='tab'){ S.tab=v; renderIng(); } else if(a==='sort'){ const p=v.split('|'); sortWaste(p[0],p[1]); } else if(a==='clear') clearTray(); else if(a==='serve') serve(); else if(a==='again'){ reset(); Scene.bins(0,0); renderAll(); } });

/* ============ 4. SCENE 3D: satu meja dapur ============ */
const Scene=(()=>{
  const cv=$('c'), R=new THREE.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene(); sc.background=new THREE.Color(0xd6ecf5);
  const cam=new THREE.PerspectiveCamera(40,1,.1,100), look=new THREE.Vector3(0,1.1,-.2);
  sc.add(new THREE.HemisphereLight(0xffffff,0x8a9a9a,.95)); const sun=new THREE.DirectionalLight(0xffffff,.6); sun.position.set(4,10,6); sc.add(sun);
  const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
  const box=(w,h,d,c,x,y,z,p,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||mat(c));o.position.set(x,y,z);(p||sc).add(o);return o;};
  function label(txt,w,bg,fg){ const k=document.createElement('canvas'); k.width=256;k.height=64; const g=k.getContext('2d'); g.fillStyle=bg||'rgba(255,255,255,.92)'; g.fillRect(0,0,256,64); g.fillStyle=fg||'#16322a'; let f=txt.length<6?56:txt.length<9?38:28; g.font='bold '+f+'px sans-serif'; while(g.measureText(txt).width>238&&f>10){f-=2;g.font='bold '+f+'px sans-serif';} g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,128,34);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k)})); s.scale.set(w,w/4,1); return s; }
  function flat(txt,w,bg,fg,x,y,z,p){ const s=label(txt,w,bg,fg), m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:s.material.map})); m.position.set(x,y,z); (p||sc).add(m); return m; }
  /* ruang dapur: lantai, dinding biru SPPG, meja */
  box(40,.2,30,0xdfe9e2,0,-.1,0); box(40,7,.3,0x1e5fb4,0,3.5,-5.2); flat('SPPG SMAN 3 Surakarta · MBG Sehat & Zero Waste',7.5,'#ffffff','#0d3b7a',0,5.3,-5);
  box(7.6,1,7.6,0xc9b79c,0,.5,-.5);
  /* rak bahan 4 x 3 (klik peti untuk menambah) */
  const crates=[]; ING.forEach((g,i)=>{ const col=i%4,row=(i/4)|0, top=1+row*.35, z=-1.3-row;
    if(col===0&&row>0) box(5,row*.35,1,0xb8a88c,0,1+row*.175,z); const p=new THREE.Group(); p.position.set(-1.65+col*1.1,top+.32,z); sc.add(p);
    const b=box(.9,.62,.7,g.c,0,0,0,p); b.userData.id=g.id; crates.push(b); box(.95,.08,.75,0x6b4a2b,0,-.34,0,p); const l=label(g.e+' '+g.n,1.2); l.position.set(0,.62,0); p.add(l); });
  /* ompreng 4 sekat: A nasi | B lauk | C sayur | D buah */
  const om=new THREE.Group(); om.position.set(0,1.06,1.2); om.scale.setScalar(1.25); sc.add(om); box(2.8,.08,1.8,0xb9c3cb,0,0,0,om);
  const rim=mat(0x8f9aa3);
  [[0,-.9,2.8,.06],[0,.9,2.8,.06],[-1.4,0,.06,1.8],[1.4,0,.06,1.8],[-.2,0,.06,1.8],[.6,-.1,1.6,.06],[.7,.4,.06,1]].forEach(d=>box(d[2],.14,d[3],0,d[0],.07,d[1],om,rim));
  const CMP={A:{x:-.8,z:0,c:3},B:{x:.6,z:-.5,c:5},C:{x:.25,z:.45,c:3},D:{x:1.05,z:.45,c:2}};
  [['NASI',-.8,.78],['LAUK',.6,-.22],['SAYUR',.25,.78],['BUAH',1.05,.78]].forEach(l=>{ const m=flat(l[0],.55,'#dfe6ea','#4a5a64',l[1],.06,l[2],om); m.rotation.x=-Math.PI/2; });
  const items=new THREE.Group(); om.add(items); let tag=null, hasConf=false;
  /* dua bak pemilahan sisa organik: kompos dan biogas */
  const BINS={}; [['kompos',-3.0,0x2f8a4a,'KOMPOS'],['biogas',3.0,0xd9731a,'BIOGAS']].forEach(b=>{ const g=new THREE.Group(); g.position.set(b[1],1.45,1.5); sc.add(g);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.5,.42,.9,16,1,true),new THREE.MeshLambertMaterial({color:b[2],side:THREE.DoubleSide})));
    const fill=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.1,16),mat(0x5b4026)); fill.position.y=-.4; g.add(fill);
    const l=label(b[3],1.1,'#ffffff','#16322a'); l.position.y=.85; g.add(l); BINS[b[0]]={g,fill,pulse:0,n:0}; });
  function bins(k,b){ [['kompos',k],['biogas',b]].forEach(x=>{ const B=BINS[x[0]]; if(x[1]>B.n) B.pulse=1; B.n=x[1]; const h=.1+Math.min(x[1],12)*.06; B.fill.scale.y=h/.1; B.fill.position.y=-.45+h/2; }); }
  function sync(){
    while(items.children.length) items.remove(items.children[0]);
    const c=S.st[S.cur], bad=new Set(conf(S.cur)), cnt={A:0,B:0,C:0,D:0}; let newest=null;
    for(const id in c.tray) for(let q=0;q<c.tray[id];q++){ const g=ingBy[id], k=g.cat, P=CMP[k], n=cnt[k]++;
      const m=new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),mat(g.c,bad.has(id)?{emissive:0xff0000}:{}));
      if(k==='A') m.scale.set(1.3,.7,1.3); m.userData.y=.2+((n/(P.c*2))|0)*.2; m.userData.id=id; m.userData.born=0;
      m.position.set(P.x+((n%P.c)-(P.c-1)/2)*.3,m.userData.y,P.z+(((n/P.c)|0)%2?.2:-.15)); items.add(m); if(id===S.lastId) newest=m; }
    if(newest) newest.userData.born=performance.now();
    hasConf=bad.size>0;
    if(tag) sc.remove(tag); const s=STU[S.cur];
    tag=hasConf?label('⚠️ ALERGI '+s.a.join(' + ').toUpperCase()+'!',3.4,'#c62828','#ffffff'):label('Ompreng: '+s.n+' · '+s.k,3.2,'#1e5fb4','#ffffff');
    tag.position.set(0,3.0,1.2); sc.add(tag); }
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
  cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ptr,cam); const h=ray.intersectObjects(crates)[0]; if(h) add(h.object.userData.id,1); });
  function fit(){ const w=$('stage').clientWidth, h=$('stage').clientHeight; if(!w||!h) return; R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    const dist=Math.max(8.2,3.7/(Math.tan(cam.fov*Math.PI/360)*cam.aspect)); cam.position.set(look.x,look.y+dist*.6,look.z+dist*.8); cam.lookAt(look); }
  new ResizeObserver(fit).observe($('stage')); fit();
  const clock=new THREE.Clock(); let t=0;
  (function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05); t+=dt; const now=performance.now();
    rim.color.setHex(hasConf&&Math.sin(t*10)>0?0xff3030:0x8f9aa3);   // sekat berkedip merah saat kontaminasi
    items.children.forEach(m=>{ if(m.userData.born){ const k=(now-m.userData.born)/300; if(k>=1){ m.position.y=m.userData.y; m.userData.born=0; } else m.position.y=m.userData.y+(1-k)*(1-k)*.9; } });
    for(const k in BINS){ const B=BINS[k]; if(B.pulse>0){ B.pulse=Math.max(0,B.pulse-dt*3); B.g.scale.setScalar(1+Math.sin(B.pulse*Math.PI)*.15); } }
    if(tag) tag.position.y=3.0+Math.sin(t*2)*.04;
    R.render(sc,cam); })();
  return {sync,fit,bins};
})();
renderAll(); toast('Selamat bertugas, Kepala Koki! Pilih siswa, cek alergi, lalu racik menu.');
</script>
